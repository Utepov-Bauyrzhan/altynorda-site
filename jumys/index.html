<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.png">
<title>ALTYN ORDA — Жұмысқа өтініш және тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8892b;--gold2:#e9d39a;--ink:#1d1b17;--mut:#6f6a60;--bg:#faf8f3;--card:#fff;--line:#e8e2d4;
--blue:#3a6fb0;--sky:#5bb8dc;--orange:#e5a043;--green:#5aa95a;--red:#c8463c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.wide{max-width:1100px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;letter-spacing:.14em;color:var(--gold);font-size:15px}
.lang button{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{font-size:24px;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
p{line-height:1.55}
.mut{color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff}
.btn{display:inline-block;border:0;background:var(--ink);color:#fff;padding:13px 22px;border-radius:10px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 20px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.qtext{font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 20px;min-height:84px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:#fff;padding:14px 16px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#fbf4e3}
.part{display:inline-block;background:#f3ead4;color:#7a5a17;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:6px}
.err{color:var(--red);font-size:14px;margin-top:10px}
footer{margin-top:28px;text-align:center;font-size:12px}
footer a{color:var(--mut)}
/* admin */
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.item:hover{border-color:var(--gold)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.p-hi{background:#e3f1e3;color:#2d6b2d}.p-mid{background:#fbf0d9;color:#8a6212}.p-lo{background:#f7e0de;color:#9b2f27}
.chart{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0 14px;align-items:center}
.zones{display:grid;grid-template-columns:16% 18% 32% 18% 16%;font-size:11px;color:var(--mut);text-align:center}
.zones div{border-left:1px dashed #bbb;padding-bottom:4px}
.zones div:last-child{border-right:1px dashed #bbb}
.tl{padding:7px 0}
.tl b{font-size:14px;font-weight:600}
.tl small{display:block;color:#9a948a;font-size:11px}
.track{position:relative;height:30px;background:linear-gradient(90deg,transparent 0,transparent 16%,#0000 16%) ,#f1efea;border-radius:3px}
.track .grid{position:absolute;top:-6px;bottom:-6px;border-left:1px dashed #bbb}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:600}
.bar.out{justify-content:flex-start}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%)}
.synd{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.syn{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.syn h4{margin:0;padding:10px 14px;background:#f5f2ea;font-size:14px}
.syn p{margin:0;padding:12px 14px;font-size:14px}
.syn.warn h4{background:#f7e0de}.syn.good h4{background:#e3f1e3}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.kpi small{color:var(--mut);font-size:12px}.kpi div{font-size:20px;font-weight:700;margin-top:4px}
ul.iq{padding-left:18px;line-height:1.6}
.note{font-size:13px;background:#f5f2ea;border-radius:10px;padding:12px 14px;color:#5b5446}
.flash{color:var(--red);font-weight:700;margin-right:4px}
@media(max-width:640px){.chart{grid-template-columns:120px 1fr}.tl small{display:none}.zones{font-size:9px}.qtext{font-size:18px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.job{border-top:1px dashed var(--line);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;background:#fff;margin:0}
.chip input{width:auto;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cvt{border-collapse:collapse;width:100%;font-size:14px}.cvt td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}.cvt td:first-child{color:var(--mut);width:40%}
h3{font-size:15px;margin:18px 0 6px}
.quote{background:#faf6ec;border-left:3px solid var(--gold);padding:10px 14px;border-radius:6px;margin:0;white-space:pre-wrap;font-size:14px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
input.bad,textarea.bad,select.bad{border-color:var(--red);background:#fdf1f0;box-shadow:0 0 0 2px #c8463c22}
.chip.bad{border-color:var(--red);background:#fdf1f0;color:var(--red)}
.err{font-weight:600}
.sched{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sched div{display:flex;justify-content:space-between;padding:10px 14px;font-size:15px}
.sched div+div{border-top:1px solid var(--line)}
.top{margin-bottom:18px}
.top .lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
.hero{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.hero img{width:96px;height:96px;border-radius:50%;flex:none;display:block}
.h-name{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:34px;line-height:1;letter-spacing:.01em;color:#16151a}
.h-sub{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:15px;letter-spacing:.16em;margin-top:6px;color:#16151a}
.h-loc{font-size:16px;color:#6b6f7a;margin-top:4px}
@media(max-width:480px){.hero{gap:14px;padding:12px 14px}.hero img{width:72px;height:72px}.h-name{font-size:26px}.h-sub{font-size:12px}.h-loc{font-size:14px}}
.btn.big{font-size:17px;padding:16px 26px;width:100%;justify-content:center;text-align:center;display:flex}
.btn.wa{background:#1fa855;color:#fff}
.vac .vt{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;color:#7a5a17;background:#f3ead4;padding:5px 10px;border-radius:20px}
.vac h1{font-size:22px;margin:12px 0 8px}.vac h3{font-size:16px;margin:20px 0 6px}
.vac ul{margin:0;padding-left:20px;line-height:1.6}.vac ul ul{margin-top:2px}
.vac .vend{font-weight:600;background:#faf6ec;border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;margin:20px 0 0}
.chip.ack{margin-top:20px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.vac h4{font-size:15px;margin:12px 0 4px}
.vac .vnote{background:#fdf1f0;border-left:3px solid var(--red);padding:10px 14px;border-radius:6px;margin:12px 0 0;font-size:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:18px}
.tb-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.tb-brand img{width:46px;height:46px;border-radius:50%}
.tb-brand b{display:block;font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:19px;line-height:1}
.tb-brand small{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--mut)}
.tb-right .lang{display:flex;gap:4px}
.jhero{background:radial-gradient(900px 400px at 90% 0,#1f4a6e 0,transparent 60%),linear-gradient(160deg,#0e2238 0,#163352 100%);color:#fff;border-radius:20px;padding:34px 30px}
.jhero .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#e7cf8d;border:1px solid #c9a24a66;border-radius:30px;padding:5px 12px}
.jhero h1{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:34px;line-height:1.1;margin:14px 0 10px}
.jhero p{color:#d5dde6;font-size:16px;max-width:620px;margin:0}
.jchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.jchips span{background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;padding:7px 11px;font-size:13px;color:#e8edf3}
.jsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.js{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.js i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:Montserrat,Inter,sans-serif;background:#f3ead4;color:#7a5a17;flex:none}
.js.on i{background:var(--gold);color:#1b1404}
.js b{display:block;font-size:14px}.js small{color:var(--mut);font-size:12px}
.jh2{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:22px;margin:26px 0 14px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s}
.rcard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 30px #0e22380f}
.rcard.sel{border-color:var(--gold);background:#fffaf0}
.ric{font-size:28px;width:52px;height:52px;border-radius:14px;background:#f8f4ea;display:grid;place-items:center}
.rbody b{display:block;font-size:18px;margin-bottom:4px}
.rbody small{display:block;color:var(--mut);font-size:14px;line-height:1.45}
.rsal{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;background:#eef6ef;color:#2d6b2d;border-radius:8px;padding:5px 9px}
.rgo{margin-top:auto;color:var(--gold);font-weight:700;font-size:14px}
.rgrid .rcard:last-child:nth-child(odd){grid-column:1/-1}
.jnote{color:var(--mut);font-size:14px;text-align:center;margin:22px 0 0}
@media(max-width:640px){.jhero{padding:26px 20px}.jhero h1{font-size:26px}.jsteps{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr}.rgrid .rcard:last-child:nth-child(odd){grid-column:auto}.tb-brand b{font-size:17px}}
/* a11y / easier */
.tb-brand small{font-size:12px}
.lang button{min-height:44px;min-width:44px;padding:8px 12px;font-size:14px}
footer{font-size:15px}footer a{display:inline-block;padding:12px 8px}
.chip{min-height:44px;cursor:pointer}
.chip input{width:22px;height:22px;flex:none;accent-color:#c9a24a;cursor:pointer}
.chip.ack,.chip.cons{display:flex;width:100%;padding:14px}
.more{margin-top:26px;border:1px solid var(--line);border-radius:14px;background:#fcfbf8}
.more>summary{list-style:none;cursor:pointer;padding:16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.more>summary::-webkit-details-marker{display:none}
.more>summary small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.more>summary:after{content:"＋";font-size:22px;color:#7a5a17}
.more[open]>summary:after{content:"－"}
.more>.in{padding:0 16px 16px}
.hint{background:#eef7f0;border:1px solid #cfe8d6;color:#1d5c35;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hint button{border:0;background:none;color:#1d5c35;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.half{background:#fff7e0;border:1px solid #f0dca3;color:#7a5a17;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;margin:10px 0 0}
.req{color:var(--red)}
@media(max-width:380px){.tb-brand{gap:8px}.tb-brand img{width:40px;height:40px}.tb-brand b{font-size:16px}.tb-brand small{font-size:12px;letter-spacing:.06em}.lang button{padding:8px;min-width:40px}}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
/* ===================== CONFIG ===================== */
const WA_NUMBER = "77770198800";
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwBZVaJegArgLwB0BsanfLEI9Zzq0Mr272rcgsnwmzPAKZKV841vNuT4ak61SRL71SsWg/exec"; // «Жұмысқа үміткерлер» Google кестесі

/* ===================== TRAITS ===================== */
const TRAITS = {
 A:{kz:"Зейінділік",ru:"Внимательность",lo:"шашыраңқы",hi:"жинақы",c:"var(--blue)"},
 B:{kz:"Позитивтілік",ru:"Позитивность",lo:"пессимист",hi:"көңілді",c:"var(--blue)"},
 C:{kz:"Сабырлылық",ru:"Самообладание",lo:"жүйкесі әлсіз",hi:"сабырлы",c:"var(--blue)"},
 D:{kz:"Тұрақтылық",ru:"Уверенность / надёжность",lo:"тұрақсыз",hi:"сенімді",c:"var(--sky)"},
 E:{kz:"Белсенділік",ru:"Активность",lo:"енжар",hi:"энергиялы",c:"var(--orange)"},
 F:{kz:"Табандылық",ru:"Настойчивость",lo:"тез беріледі",hi:"табанды",c:"var(--orange)"},
 G:{kz:"Жауапкершілік",ru:"Ответственность",lo:"бастамасыз",hi:"жауапты",c:"var(--orange)"},
 H:{kz:"Объективтілік",ru:"Объективность",lo:"сынды қабылдамайды",hi:"әділ",c:"var(--green)"},
 I:{kz:"Сезімталдық",ru:"Чуткость",lo:"салқын",hi:"жылы",c:"var(--green)"},
 J:{kz:"Көпшілдік",ru:"Общительность",lo:"тұйық",hi:"ашық",c:"var(--green)"}
};
const KEYS = Object.keys(TRAITS);

/* ===== PART 1: statements (k: +1 келісу = қасиет жоғары, -1 кері) ===== */
const ST = [
 ["A1","A",1,"Телефон нөмірлерін, туған күндерді оңай есте сақтаймын.","Я легко запоминаю номера телефонов и дни рождения.","f"],
 ["A2","A",-1,"Кітап не мақала оқығанда, ойым бөлініп, қайта оқуға тура келеді.","Читая книгу или статью, я отвлекаюсь, и приходится перечитывать.","f"],
 ["A3","A",1,"Таныстарымның шашы не киімі өзгерсе, бірден байқаймын.","Я сразу замечаю, если знакомый сменил причёску или одежду.","f"],
 ["A4","A",-1,"Кілтімді не телефонымды қайда қойғанымды ұмытып қаламын.","Я забываю, куда положил(а) ключи или телефон.","f"],
 ["B1","B",1,"Қиын күннің өзінде жақсы нәрсе таба аламын.","Даже в трудный день я нахожу что-то хорошее.","f"],
 ["B2","B",-1,"Басыма қорқынышты, уайымды ойлар келеді.","Мне в голову приходят тревожные, пугающие мысли.","f"],
 ["B3","B",1,"Айналамдағылар мені көңілді адам дейді.","Окружающие считают меня жизнерадостным человеком.","a"],
 ["B4","B",-1,"Бір ісім сәтсіз болса, көңілім ұзақ уақыт түсіп жүреді.","Если у меня что-то не получилось, я долго хожу расстроенным(ой).","f"],
 ["C1","C",1,"Біреу маған дауыс көтерсе де, сабырымды сақтаймын.","Даже если на меня повышают голос, я сохраняю спокойствие.","f"],
 ["C2","C",-1,"Ұсақ нәрсеге тез ашуланып қаламын.","Я быстро раздражаюсь из-за мелочей.","f"],
 ["C3","C",1,"Асығыс жағдайда да ойланып барып шешім қабылдаймын.","Даже в спешке я принимаю решения обдуманно.","f"],
 ["C4","C",-1,"Қобалжысам, ұйқым қашып, тамаққа зауқым болмайды.","Когда волнуюсь, я теряю сон и аппетит.","f"],
 ["D1","D",1,"Уәде берсем, оны орындаймын.","Если я что-то пообещал(а), я это выполняю.","f"],
 ["D2","D",-1,"Көңіл-күйім күні бойы бірнеше рет өзгереді.","Моё настроение меняется несколько раз за день.","f"],
 ["D3","D",1,"Шешім қабылдасам, үлкен себепсіз оны өзгертпеймін.","Приняв решение, я не меняю его без серьёзной причины.","f"],
 ["D4","D",-1,"Бастаған ісімді жарты жолда тастап кетемін.","Я бросаю начатое на полпути.","f"],
 ["E1","E",1,"Бос отыра алмаймын, әрқашан бір іс тауып аламын.","Я не могу сидеть без дела, всегда нахожу занятие.","a"],
 ["E2","E",-1,"Демалыс күні үйден шықпай жату маған ұнайды.","Мне нравится провести выходной дома, никуда не выходя.","l"],
 ["E3","E",1,"Жаңа іске алғашқылардың бірі болып кірісемін.","Я берусь за новое дело одним из первых.","f"],
 ["E4","E",-1,"Таңертең төсектен тұру маған қиын.","Мне трудно вставать по утрам.","f"],
 ["F1","F",1,"«Жоқ» деген жауапты естісем, мақсатқа жетудің басқа жолын іздеймін.","Услышав «нет», я ищу другой путь к цели.","f"],

function parseBirth(d){const m=String(d||"").match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m)return null;const D=+m[1],M=+m[2],Y=+m[3];const t=new Date(Y,M-1,D);
 if(t.getFullYear()!==Y||t.getMonth()!==M-1||t.getDate()!==D)return null;const now=new Date().getFullYear();if(Y<now-80||Y>now-14)return null;return t}
function validBirth(d){return!!parseBirth(d)}
function ageOf(d){const b=parseBirth(d);if(!b)return"";const n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return String(a)}
function fmtD(d){if(!d)return"";const p=d.split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:d}

function payload(rec){const q=questionsFor(rec.role).filter(x=>x.type!=="open");
 const a=q.map(x=>{const k=x.type==="st"?x.d[0]:x.type==="sit"?x.d.id:x.id;const v=rec.answers[k];return v==null?"x":String(x.type==="st"?v+2:v)}).join("");
 const c={...rec};["answers","scores","lie","contra","traitFit","prOk","prTotal","fit","startedAt","finishedAt","v","consent"].forEach(k=>delete c[k]);
 c.jobs=(c.jobs||[]).filter(j=>j.place||j.pos||j.time||j.why);
 const o=OPEN[rec.role]?rec.answers[OPEN[rec.role].id]:undefined;
 return{c,a,o}}
function code(rec){return"AO2:"+JSON.stringify(payload(rec))}
function decode(txt){let m=txt.match(/AO2:(\{[\s\S]*\})/);
 if(m){const j=JSON.parse(m[1]);const role=ROLES[j.c.role]?j.c.role:"seller";let q=questionsFor(role).filter(x=>x.type!=="open");
  if(j.a.length!==q.length){q.length=0;q.push(...questionsFor(role,true).filter(x=>x.type!=="open"))}if(j.a.length!==q.length)throw 0;const answers={};
  q.forEach((x,i)=>{const ch=j.a[i];if(ch==="x")return;const k=x.type==="st"?x.d[0]:x.type==="sit"?x.d.id:x.id;answers[k]=x.type==="st"?Number(ch)-2:Number(ch)});
  if(OPEN[role]&&j.o)answers[OPEN[role].id]=j.o;
  return{...j.c,role,answers,...score(answers,role),finishedAt:Date.now(),fromCode:true}}
 m=txt.match(/AO1\|[^\n]*/);if(m){const p=m[0].split("|");const a=p[6]||"";const ids=[...ST.map(s=>s[0]),...SIT.map(s=>s.id)];if(a.length!==ids.length)throw 0;
  const answers={};ids.forEach((k,i)=>{if(a[i]!=="x")answers[k]=Number(a[i])-2});
  return{role:"seller",name:p[1],phone:p[2],age:p[3],durationSec:Number(p[5]),answers,...score(answers,"seller"),finishedAt:Date.now(),fromCode:true}}
 throw 0}

 <div class="track">${lines}<div class="bar ${out?"out":""}" style="width:${Math.max(w,1)}%;background:${t.c}">${out?"":v}</div>${out?`<span style="position:absolute;left:calc(${w}% + 6px);top:7px;font-size:12px;font-weight:600">${v}</span>`:""}</div>`}).join("")}
 <div></div><div class="axis">${[-100,-68,-32,32,68,100].map(v=>`<span style="left:${x(v)}%">${v}</span>`).join("")}</div></div>`}

const CVL={edu:Object.fromEntries(EDU.map(e=>[e[0],e[1][0]])),lvl:Object.fromEntries(LVL.map(e=>[e[0],e[1][0]])),sched:Object.fromEntries(SCHED.map(e=>[e[0],e[1][0]])),src:Object.fromEntries(SRC.map(e=>[e[0],Array.isArray(e[1])?e[1][0]:e[1]])),sk:Object.fromEntries(SKILLS.map(e=>[e[0],Array.isArray(e[1])?e[1][0]:e[1]]))};
function cvBlock(r){const rows=[["Туған күні",fmtD(r.birth)],["Мекенжайы",r.live],["Білімі",[CVL.edu[r.edu],r.eduSpec].filter(Boolean).join(", ")],["Тілдер",[r.lkz&&"қазақша — "+CVL.lvl[r.lkz],r.lru&&"орысша — "+CVL.lvl[r.lru]].filter(Boolean).join("; ")],
 ["Дағдылар",(r.skills||[]).map(k=>CVL.sk[k]).join(", ")],["Күтетін жалақы",r.salary?r.salary+" ₸":""],["Жұмысқа шыға алатын күні",r.startDate],["Кесте ыңғайлы ма",CVL.sched[r.sched]],["Вакансияны қайдан білді",CVL.src[r.src]]].filter(x=>x[1]);
 const jobs=(r.jobs||[]).filter(j=>j.place||j.pos);
 if(!rows.length&&!jobs.length&&!r.why&&!r.ach)return"";
 return`<div class="card" style="margin-bottom:16px"><h2>Резюме</h2><table class="cvt">${rows.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td></tr>`).join("")}</table>
 <h3>Жұмыс тәжірибесі</h3>${jobs.length?`<ul class="iq">${jobs.map(j=>`<li><b>${esc(j.place||"—")}</b>${j.pos?", "+esc(j.pos):""}${j.time?" · "+esc(j.time):""}${j.why?`<br><span class="mut">Кету себебі: ${esc(j.why)}</span>`:""}</li>`).join("")}</ul>`:`<p class="mut">Тәжірибе көрсетілмеген.</p>`}
 ${r.why?`<h3>Неге ALTYN ORDA?</h3><p class="quote">${esc(r.why)}</p>`:""}${r.ach?`<h3>Ең үлкен жетістігі</h3><p class="quote">${esc(r.ach)}</p>`:""}</div>`}
function prBlock(r){const role=ROLES[r.role]?r.role:"seller";const ids=ROLE_PR[role];if(!ids.some(id=>r.answers&&r.answers[id]!=null))return"";
 return`<div class="card" style="margin-bottom:16px"><h2>Жұмыстағы есептер: ${r.prOk} / ${r.prTotal}</h2><ul class="iq">${ids.map(id=>{const p=PR[id],a=r.answers[id],ok=a===p.c;
 return`<li>${ok?'<span style="color:var(--green);font-weight:700">✓</span>':'<span style="color:var(--red);font-weight:700">✗</span>'} ${esc(p.kz)}${ok?"":`<br><span class="mut">Жауабы: ${a==null?"—":esc(p.o[a][0])} · Дұрысы: ${esc(p.o[p.c][0])}</span>`}</li>`}).join("")}</ul>
 ${OPEN[role]&&r.answers[OPEN[role].id]?`<h3>${esc(OPEN[role].kz)}</h3><p class="quote">${esc(r.answers[OPEN[role].id])}</p><p class="mut" style="font-size:13px">Бұл мәтінді өзіңіз бағалаңыз: сауаттылық, тартымдылық, баға мен тапсырыс жолы бар ма.</p>`:""}</div>`}
function report(r){const s=r.scores;const role=ROLES[r.role]?r.role:"seller";const syn=SYN.filter(z=>z[0](s));
 if(r.lie>=4)syn.unshift([0,"warn","Тым мінсіз жауаптар","«Ешқашан өтірік айтпаймын» сияқты пікірлерге келіскен. Нәтиже шынайы болмауы мүмкін, сұхбатта тексеріңіз."]);
 if(r.contra>=3)syn.unshift([0,"warn","Қарама-қайшы жауаптар","Бір-біріне қайшы пікірлердің екеуіне де бірдей жауап берген. Сұрақтарды мұқият оқымаған болуы мүмкін."]);
 if(r.durationSec&&r.durationSec<(r.prTotal?300:150))syn.unshift([0,"warn","Тым жылдам","Тестті "+Math.max(1,Math.round(r.durationSec/60))+" минутта бітірген. Оқымай белгілеген болуы мүмкін."]);
 if(r.prTotal&&r.prOk<=r.prTotal/2)syn.unshift([0,"warn","Есептер әлсіз","Жұмыстағы есептердің жартысына да дұрыс жауап бермеген."]);
 if(r.sched==="no")syn.unshift([0,"warn","Кесте сәйкес емес","Кандидат жұмыс кестесі ыңғайсыз екенін көрсеткен."]);
 const weak=KEYS.filter(k=>s[k]<0).sort((a,b)=>s[a]-s[b]).slice(0,4);
 const verdict=r.fit>=65?"Сұхбатқа шақыруға болады.":r.fit>=45?"Әлсіз жақтарын сұхбатта міндетті түрде тексеріңіз.":"Бұл лауазымға сәйкестігі төмен. Тек басқа дәлел болса ғана шақырыңыз.";
 const top=KEYS.slice().sort((a,b)=>ROLES[role].w[b]-ROLES[role].w[a]).slice(0,4).map(k=>TRAITS[k].kz).join(", ");
 return`<header><div class="brand">ALTYN ORDA · КАНДИДАТ</div><button class="btn ghost" onclick="sel=null;drawAdmin()">← Тізімге</button></header>
 <div class="card" style="margin-bottom:16px"><span class="part">${ROLES[role].kz}</span><h1>${esc(r.name)}${r.age?` <span class="mut" style="font-weight:400">(${esc(r.age)} жас)</span>`:""}</h1>
 <div class="mut">${esc(r.phone)}${r.durationSec?" · тест "+Math.round(r.durationSec/60)+" мин":""}${r.fromCode?" · WhatsApp-тан":""}${r.finishedAt?" · "+new Date(r.finishedAt).toLocaleDateString("ru-RU"):""}</div>
 <div class="kpis"><div class="kpi"><small>Лауазымға сәйкестік</small><div>${r.fit}%</div></div>
 ${r.prTotal?`<div class="kpi"><small>Мінез бойынша</small><div>${r.traitFit}%</div></div><div class="kpi"><small>Есептер</small><div>${r.prOk} / ${r.prTotal}</div></div>`:""}
 <div class="kpi"><small>Ең күшті</small><div style="font-size:15px">${KEYS.slice().sort((a,b)=>s[b]-s[a]).slice(0,2).map(k=>TRAITS[k].kz).join(", ")}</div></div>
 <div class="kpi"><small>Ең әлсіз</small><div style="font-size:15px">${KEYS.slice().sort((a,b)=>s[a]-s[b]).slice(0,2).map(k=>TRAITS[k].kz).join(", ")}</div></div></div>
 <p style="margin:0"><b>Қорытынды бағыт:</b> ${verdict}</p><p class="mut" style="font-size:13px;margin:6px 0 0">Бұл лауазымда ең маңызды қасиеттер: ${top}.</p></div>
 ${cvBlock(r)}
 <div class="card" style="margin-bottom:16px"><h2>Мінез бен жеке қасиеттер</h2>${chart(s)}</div>
 <div class="card" style="margin-bottom:16px"><h2>Синдромдар мен ерекшеліктер</h2>${syn.length?`<div class="synd">${syn.map(z=>`<div class="syn ${z[1]}"><h4>${z[2]}</h4><p>${z[3]}</p></div>`).join("")}</div>`:`<p class="mut">Ерекше белгі жоқ — профиль теңгерімді.</p>`}</div>
 ${prBlock(r)}
 ${weak.length?`<div class="card" style="margin-bottom:16px"><h2>Сұхбатта қоятын сұрақтар</h2><ul class="iq">${weak.map(k=>`<li><b>${TRAITS[k].kz} (${s[k]}):</b> ${IQ[k]}</li>`).join("")}</ul></div>`:""}
 <p class="note">Бұл тест — сұхбатқа бағыт беретін құрал, шешім емес. Соңғы шешімді сұхбат және стажировкадағы нақты нәтиже бойынша қабылдаңыз.</p>
 ${r.id&&db?`<div style="margin-top:16px"><button id="delb" class="btn ghost" onclick="delRes()">Нәтижені өшіру</button></div>`:""}`}
if(location.hash!=="#natizheler")loadLocal();
route();
</script>
</body>
</html>
